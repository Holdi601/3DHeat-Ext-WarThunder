<svg xmlns="http://www.w3.org/2000/svg" width="804" height="449" viewBox="0 0 804 449" role="img" aria-label="heat3d-wt-replay: help">
<rect width="804" height="449" rx="8" fill="#1e1f24"/>
<rect width="804" height="26" rx="8" fill="#2c2e35"/><rect y="18" width="804" height="8" fill="#2c2e35"/>
<circle cx="16" cy="13" r="5" fill="#ff5f57"/><circle cx="32" cy="13" r="5" fill="#febc2e"/><circle cx="48" cy="13" r="5" fill="#28c840"/>
<text x="402.0" y="17" fill="#9aa0aa" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">heat3d-wt-replay: help</text>
<g font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="14" xml:space="preserve" style="white-space:pre">
<text x="16" y="46" fill="#7ee787" xml:space="preserve" style="white-space:pre">$&#160;heat3d-wt-replay&#160;--help</text>
<text x="16" y="65" fill="#d6d9df" xml:space="preserve" style="white-space:pre">usage:&#160;heat3d-wt-replay&#160;[-h]&#160;-o&#160;OUT&#160;[--game&#160;GAME]&#160;[--no-smoothing]&#160;[--container]&#160;[--loose]</text>
<text x="16" y="84" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;[--version]</text>
<text x="16" y="103" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;replays&#160;[replays&#160;...]</text>
<text x="16" y="122" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="141" fill="#d6d9df" xml:space="preserve" style="white-space:pre">War&#160;Thunder&#160;replays&#160;(.wrpl)&#160;into&#160;3DHeat&#160;tables</text>
<text x="16" y="160" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="179" fill="#d6d9df" xml:space="preserve" style="white-space:pre">positional&#160;arguments:</text>
<text x="16" y="198" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;replays&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;.wrpl&#160;files,&#160;folders&#160;of&#160;them,&#160;or&#160;zips&#160;of&#160;them</text>
<text x="16" y="217" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="236" fill="#d6d9df" xml:space="preserve" style="white-space:pre">options:</text>
<text x="16" y="255" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;-h,&#160;--help&#160;&#160;&#160;&#160;&#160;&#160;show&#160;this&#160;help&#160;message&#160;and&#160;exit</text>
<text x="16" y="274" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;-o,&#160;--out&#160;OUT&#160;&#160;&#160;where&#160;to&#160;write&#160;&lt;map&gt;/&lt;match&gt;.parquet&#160;and&#160;.match.json</text>
<text x="16" y="293" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--game&#160;GAME&#160;&#160;&#160;&#160;&#160;the&#160;War&#160;Thunder&#160;folder&#160;whose&#160;localisation&#160;names&#160;the&#160;vehicles&#160;(found&#160;if&#160;not</text>
<text x="16" y="312" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;given)</text>
<text x="16" y="331" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--no-smoothing&#160;&#160;keep&#160;other&#160;units&#x27;&#160;dead-reckoned&#160;and&#160;received&#160;samples&#160;where&#160;the&#160;replay&#160;has</text>
<text x="16" y="350" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;them</text>
<text x="16" y="369" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--container&#160;&#160;&#160;&#160;&#160;pack&#160;each&#160;battle&#160;into&#160;one&#160;.3dheat&#160;file&#160;(the&#160;default)</text>
<text x="16" y="388" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--loose&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;keep&#160;each&#160;battle&#160;as&#160;separate&#160;files&#160;(table,&#160;match.json,&#160;sidecars),&#160;not&#160;one</text>
<text x="16" y="407" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;.3dheat&#160;container</text>
<text x="16" y="426" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--version&#160;&#160;&#160;&#160;&#160;&#160;&#160;show&#160;program&#x27;s&#160;version&#160;number&#160;and&#160;exit</text>
</g></svg>
