<text x="16" y="604" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--no-texture&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;do&#160;not&#160;texture&#160;the&#160;ground&#160;with&#160;the&#160;tactical&#160;map</text>
