<text x="406.5" y="17" fill="#9aa0aa" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">heat3d-wt-replay: level-help</text>
<g font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="14" xml:space="preserve" style="white-space:pre">
<text x="16" y="46" fill="#7ee787" xml:space="preserve" style="white-space:pre">$&#160;heat3d-wt-level&#160;--help</text>
<text x="16" y="65" fill="#d6d9df" xml:space="preserve" style="white-space:pre">usage:&#160;heat3d-wt-level&#160;[-h]&#160;[--version]&#160;{list,extract}&#160;...</text>
<text x="16" y="84" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="103" fill="#d6d9df" xml:space="preserve" style="white-space:pre">War&#160;Thunder&#160;levels&#160;into&#160;3DHeat&#160;.glb&#160;levels</text>
<text x="16" y="122" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="141" fill="#d6d9df" xml:space="preserve" style="white-space:pre">positional&#160;arguments:</text>
<text x="16" y="160" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;{list,extract}</text>
<text x="16" y="179" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;list&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;list&#160;the&#160;levels&#160;in&#160;the&#160;install</text>
<text x="16" y="198" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;extract&#160;&#160;&#160;&#160;&#160;&#160;&#160;extract&#160;levels</text>
<text x="16" y="217" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="236" fill="#d6d9df" xml:space="preserve" style="white-space:pre">options:</text>
<text x="16" y="255" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;-h,&#160;--help&#160;&#160;&#160;&#160;&#160;&#160;show&#160;this&#160;help&#160;message&#160;and&#160;exit</text>
<text x="16" y="274" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--version&#160;&#160;&#160;&#160;&#160;&#160;&#160;show&#160;program&#x27;s&#160;version&#160;number&#160;and&#160;exit</text>
<text x="16" y="293" fill="#7ee787" xml:space="preserve" style="white-space:pre">$&#160;heat3d-wt-level&#160;extract&#160;--help</text>
<text x="16" y="312" fill="#d6d9df" xml:space="preserve" style="white-space:pre">usage:&#160;heat3d-wt-level&#160;extract&#160;[-h]&#160;[--all]&#160;-o&#160;OUT&#160;[--game&#160;GAME]&#160;[--max-grid&#160;MAX_GRID]</text>
<text x="16" y="331" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;[--no-objects]&#160;[--detail&#160;{low,medium,high}]</text>
<text x="16" y="350" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;[--max-object-triangles&#160;MAX_OBJECT_TRIANGLES]&#160;[--no-generated]</text>
<text x="16" y="369" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;[--no-terrain-colour]&#160;[--no-texture]&#160;[--skip-existing]</text>
<text x="16" y="388" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;[levels&#160;...]</text>
<text x="16" y="407" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="426" fill="#d6d9df" xml:space="preserve" style="white-space:pre">positional&#160;arguments:</text>
<text x="16" y="445" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;levels&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;level&#160;names&#160;(as&#160;`list`&#160;prints&#160;them;&#160;wildcards&#160;allowed)</text>
<text x="16" y="464" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="483" fill="#d6d9df" xml:space="preserve" style="white-space:pre">options:</text>
<text x="16" y="502" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;-h,&#160;--help&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;show&#160;this&#160;help&#160;message&#160;and&#160;exit</text>
<text x="16" y="521" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--all&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;every&#160;level</text>
<text x="16" y="540" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;-o,&#160;--out&#160;OUT&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;output&#160;folder;&#160;each&#160;level&#160;goes&#160;in&#160;&lt;out&gt;/&lt;level&gt;/</text>
<text x="16" y="559" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--game&#160;GAME&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;War&#160;Thunder&#160;folder</text>
<text x="16" y="578" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--max-grid&#160;MAX_GRID&#160;&#160;&#160;heightmap&#160;samples&#160;a&#160;side,&#160;per&#160;part&#160;(default&#160;1024)</text>
<text x="16" y="597" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--no-objects&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;leave&#160;out&#160;buildings,&#160;trees&#160;and&#160;other&#160;placed&#160;objects</text>
<text x="16" y="616" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--detail&#160;{low,medium,high}</text>
<text x="16" y="635" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;ground&#160;sampling,&#160;ground&#160;colour&#160;and&#160;object&#160;budget&#160;over&#160;the&#160;tank&#160;map</text>
<text x="16" y="654" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;(default&#160;medium;&#160;low:&#160;1,200,000&#160;object&#160;triangles,&#160;medium:&#160;3,500,000</text>
<text x="16" y="673" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;object&#160;triangles,&#160;high:&#160;4,500,000&#160;object&#160;triangles)</text>
<text x="16" y="692" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--max-object-triangles&#160;MAX_OBJECT_TRIANGLES</text>
<text x="16" y="711" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;budget&#160;for&#160;objects&#160;(default:&#160;the&#160;--detail&#x27;s):&#160;over&#160;it,&#160;costly&#160;types</text>
<text x="16" y="730" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;step&#160;down&#160;a&#160;LOD,&#160;then&#160;to&#160;a&#160;crown&#160;or&#160;their&#160;collision&#160;shape,&#160;then&#160;are</text>
<text x="16" y="749" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;left&#160;out</text>
<text x="16" y="768" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--no-generated&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;leave&#160;out&#160;the&#160;objects&#160;the&#160;land&#160;classes&#160;generate&#160;(forests,&#160;towns)</text>
<text x="16" y="787" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--no-terrain-colour&#160;&#160;&#160;texture&#160;the&#160;ground&#160;with&#160;the&#160;tactical&#160;map,&#160;not&#160;the&#160;land&#160;classes</text>
<text x="16" y="806" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--no-texture&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;do&#160;not&#160;texture&#160;the&#160;ground&#160;with&#160;the&#160;tactical&#160;map</text>
<text x="16" y="825" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--skip-existing&#160;&#160;&#160;&#160;&#160;&#160;&#160;leave&#160;levels&#160;whose&#160;.glb&#160;exists</text>
</g></svg>
