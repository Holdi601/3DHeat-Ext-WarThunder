<text x="16" y="460" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;4,500,000&#160;object&#160;triangles)</text>
<text x="16" y="478" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--max-object-triangles&#160;MAX_OBJECT_TRIANGLES</text>
<text x="16" y="496" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;budget&#160;for&#160;objects&#160;(default:&#160;the&#160;--detail&#x27;s):&#160;over&#160;it,</text>
<text x="16" y="514" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;costly&#160;types&#160;step&#160;down&#160;a&#160;LOD,&#160;then&#160;to&#160;boxes</text>
<text x="16" y="532" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--no-generated&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;leave&#160;out&#160;the&#160;objects&#160;the&#160;land&#160;classes&#160;generate</text>
<text x="16" y="550" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;(forests,&#160;towns)</text>
<text x="16" y="568" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--no-terrain-colour&#160;&#160;&#160;texture&#160;the&#160;ground&#160;with&#160;the&#160;tactical&#160;map,&#160;not&#160;the&#160;land</text>
