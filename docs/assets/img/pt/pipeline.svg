<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" role="img" aria-label="From a replay to the 3DHeat viewer"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6270"/></marker></defs><rect width="880" height="510" rx="10" fill="#f7f8fa"/>
<text x="440" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#1d2330">Do replay ao visualizador 3DHeat</text>
<rect x="20" y="48" width="840" height="80" rx="8" fill="#ffffff" stroke="#5b6270" stroke-width="1.2"/>
<text x="440" y="72" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1d2330">1. Seu replay</text>
<text x="440" y="94" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">arquivos .wrpl, ou uma pasta que os contém</text>
<text x="440" y="114" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">ou as partes de um replay de servidor (0000.wrpl ...) ou o seu zip</text>
<line x1="440" y1="128" x2="440" y2="160" stroke="#5b6270" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="20" y="162" width="840" height="80" rx="8" fill="#eef4ff" stroke="#5b6270" stroke-width="1.2"/>
<text x="440" y="186" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1d2330">2. heat3d-wt-replay</text>
<text x="440" y="208" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">lê cada pacote da batalha</text>
<text x="440" y="228" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">dá nome aos veículos da sua instalação (opcional)</text>
<line x1="440" y1="242" x2="440" y2="274" stroke="#5b6270" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="20" y="276" width="408" height="80" rx="8" fill="#ffffff" stroke="#5b6270" stroke-width="1.2"/>
<text x="224" y="300" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1d2330">&lt;match&gt;.3dheat (o padrão)</text>
<text x="224" y="322" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">um arquivo por batalha: a tabela,</text>
<text x="224" y="342" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">o documento da partida e os auxiliares</text>
<rect x="452" y="276" width="408" height="80" rx="8" fill="#ffffff" stroke="#5b6270" stroke-width="1.2"/>
<text x="656" y="300" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1d2330">ou, com --loose,</text>
<text x="656" y="322" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">o mesmo, como arquivos separados:</text>
<text x="656" y="342" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">&lt;match&gt;.parquet, &lt;match&gt;.match.json, ...</text>
<line x1="440" y1="356" x2="440" y2="388" stroke="#5b6270" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="20" y="390" width="840" height="100" rx="8" fill="#eef4ff" stroke="#5b6270" stroke-width="1.2"/>
<text x="440" y="414" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1d2330">3. O visualizador 3DHeat</text>
<text x="440" y="436" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">Aba Mapa de calor: a tabela</text>
<text x="440" y="456" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">Aba Partida: o documento da partida</text>
<text x="440" y="476" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#394150">Painel Level: níveis do heat3d-wt-level</text>
</svg>
