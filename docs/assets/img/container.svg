<rect width="840" height="270" rx="10" fill="#f7f8fa"/>
<rect x="20" y="20" width="300" height="230" rx="8" fill="#e6efff" stroke="#5b6270" stroke-width="1.2"/>
<text x="170.0" y="42" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1d2330">&lt;match&gt;.3dheat</text>
<text x="170.0" y="62" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#394150">one file a battle</text>
<text x="170.0" y="79" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#394150"></text>
<text x="170.0" y="96" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#394150">manifest: game, map, match, mode,</text>
