<text x="170.0" y="164" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#394150">read by the viewer like the loose</text>
<text x="170.0" y="181" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#394150">files, a thousand at a time</text>
